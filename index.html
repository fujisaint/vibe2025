<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List (Edit)</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }
        #todoList {
            border-collapse: collapse;
            width: 70%;
            margin: 0 auto;
        }
        #todoList th, #todoList td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: center;
        }
        #todoList th {
            background-color: #f0f0f0;
        }
        #todoList th:first-child,
        #todoList th:last-child {
            width: 10%;
        }
        #todoList th:nth-child(2) {
            width: 70%;
        }
        .edit-btn {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 5px 10px;
            cursor: pointer;
            border-radius: 3px;
            margin-right: 5px;
        }
        .edit-input {
            width: 100%;
            padding: 5px;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

<h2 style="text-align: center;">To-Do List (Editing)</h2>

<table id="todoList">
    <thead>
        <tr>
            <th>Number</th>
            <th>Text</th>
            <th>Action</th>
        </tr>
    </thead>
    <tbody id="listBody">
        {{rows}}
    </tbody>
</table>

<script>
    function enableEdit(id, currentText) {
        const textCell = document.getElementById(`text-${id}`);
        const editInput = document.createElement('input');
        editInput.type = 'text';
        editInput.value = currentText;
        editInput.className = 'edit-input';
        editInput.id = `edit-${id}`;
        
        textCell.innerHTML = '';
        textCell.appendChild(editInput);
        
        const saveButton = document.createElement('button');
        saveButton.textContent = 'Save';
        saveButton.className = 'edit-btn';
        saveButton.onclick = () => saveItem(id);
        
        const actionCell = document.getElementById(`actions-${id}`);
        actionCell.innerHTML = '';
        actionCell.appendChild(saveButton);
    }

    async function saveItem(id) {
        const newText = document.getElementById(`edit-${id}`).value.trim();
        if (!newText) return;

        try {
            const response = await fetch(`/edit/${id}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text: newText })
            });
            
            if (response.ok) {
                window.location.reload();
            } else {
                console.error('Failed to update item');
            }
        } catch (error) {
            console.error('Error:', error);
        }
    }
</script>
</body>
</html>
