<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List (Removal)</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }
        #todoList {
            border-collapse: collapse;
            width: 70%;
            margin: 0 auto;
        }
        #todoList th, #todoList td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: center;
        }
        #todoList th {
            background-color: #f0f0f0;
        }
        #todoList th:first-child {
            width: 10%;
        }
        #todoList th:nth-child(2) {
            width: 80%;
        }
        #todoList th:last-child {
            width: 10%;
        }
        .delete-btn {
            background-color: #ff4444;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 5px 10px;
            cursor: pointer;
        }
        .delete-btn:hover {
            background-color: #cc0000;
        }
    </style>
</head>
<body>

<h2 style="text-align: center;">To-Do List (Removal)</h2>

<table id="todoList">
    <thead>
        <tr>
            <th>№</th>
            <th>Text</th>
            <th>Action</th>
        </tr>
    </thead>
    <tbody id="listBody">
        {{rows}}
    </tbody>
</table>

<script>
    async function deleteItem(id) {
        if (confirm('Вы уверены, что хотите удалить эту задачу?')) {
            try {
                const response = await fetch(`/delete/${id}`, {
                    method: 'DELETE'
                });

                if (response.ok) {
                    window.location.reload();
                } else {
                    console.error('Ошибка при удалении');
                }
            } catch (error) {
                console.error('Ошибка:', error);
            }
        }
    }
</script>
</body>
</html>
